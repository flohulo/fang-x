site_name: Fang X Handbuch
site_description: Spielregeln, Einstellungen und Tipps für Fang X – das GPS-Fangspiel für draussen.
site_url: https://flohulo.github.io/fang-x/
repo_url: https://github.com/flohulo/fang-x
repo_name: flohulo/fang-x
edit_uri: edit/main/docs/
copyright: Fang X · AGPL-3.0-only

theme:
  name: material
  language: de
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Zum dunklen Modus wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Zum hellen Modus wechseln
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Startseite: index.md
  - Erste Schritte: Erste-Schritte.md
  - Spieleinstellungen:
      - Übersicht: Spieleinstellungen.md
      - Spieldauer: Spieldauer.md
      - Vorsprung für X: Vorsprung-fuer-X.md
      - Reveal-Intervall: Reveal-Intervall.md
      - Sichtradius: Sichtradius.md
      - Fangradius: Fangradius.md
      - Spielgebiet: Spielgebiet.md
      - Bonusmission für X: Bonusmission-fuer-X.md
      - Notfall-Knopf: Notfall-Knopf.md

# Die interne Regelwerk-Spezifikation bleibt im Repository, gehört aber nicht ins Handbuch.
exclude_docs: |
  spielregeln.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  # Mehrsprachiges Handbuch: Deutsch ist die Quelle (Seite.md), Übersetzungen heissen
  # Seite.<sprache>.md (z. B. Spieldauer.en.md). Fehlt eine Übersetzung, wird die deutsche Seite gezeigt.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: de
          default: true
          name: Deutsch
          build: true
        - locale: en
          name: English
          build: true
          site_name: Fang X Manual
          site_description: Game rules, settings and tips for Fang X – the GPS chase game for the outdoors.
          nav_translations:
            Startseite: Home
            Erste Schritte: Getting started
            Spieleinstellungen: Game settings
            Übersicht: Overview
            Spieldauer: Game duration
            Vorsprung für X: Head start for X
            Reveal-Intervall: Reveal interval
            Sichtradius: Reveal radius
            Fangradius: Catch radius
            Spielgebiet: Play area
            Bonusmission für X: Bonus mission for X
            Notfall-Knopf: Emergency button

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/flohulo/fang-x
      name: Fang X auf GitHub
