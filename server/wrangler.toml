name = "fang-x"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Logs und Metriken im Cloudflare-Dashboard (hilft beim Betrieb)
[observability]
enabled = true

[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# Anonyme Rückmeldungen zur Runde: eine einzelne Instanz mit SQLite.
[[durable_objects.bindings]]
name = "FEEDBACK"
class_name = "FeedbackStore"

# Ratenbegrenzung pro IP-Adresse, gezählt an der Edge (kein Durable Object).
# Workers erlaubt als Zeitfenster nur 10 oder 60 Sekunden. Eine Gruppe im selben WLAN oder
# Mobilfunknetz teilt sich oft eine IPv4-Adresse: Verify und Join brauchen deshalb Spielraum
# für mehrere Geräte, die gleichzeitig einen Einladungslink öffnen oder neu verbinden.
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "LOOKUP_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "VERIFY_LIMIT"
namespace_id = "1003"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "FEEDBACK_LIMIT"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

# Der frühere Ratenbegrenzer als Durable Object ist durch [[ratelimits]] ersetzt.
[[migrations]]
tag = "v3"
deleted_classes = ["RateLimiter"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["FeedbackStore"]
