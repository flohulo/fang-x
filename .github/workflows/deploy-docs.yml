name: Webseite und Handbuch veröffentlichen

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "website/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-docs.txt

      - name: Webseite und Handbuch bauen
        run: |
          mkdir -p _site
          cp -r website/. _site/
          mkdocs build --strict -d _site/handbuch

      - name: Auf gh-pages veröffentlichen
        run: |
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: webseite und handbuch veröffentlichen"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
