name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy PR preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run build

      - name: Deploy preview Worker
        id: deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=Preview configuration::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          worker_name="fang-x-pr-${PR_NUMBER}"
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.json"
          npx wrangler deploy --name "$worker_name"
          preview_url=$(jq -r 'select(.type=="deploy") | .targets[0]' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n1)
          if [[ -z "$preview_url" || "$preview_url" == "null" ]]; then
            echo "::error title=Preview URL::Wrangler did not report a URL. Is workers_dev enabled in wrangler.toml?"
            exit 1
          fi
          echo "worker_name=$worker_name" >> "$GITHUB_OUTPUT"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Add or update preview link
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const marker = "<!-- fang-x-pr-preview -->";
            const body = `${marker}\n### Fang X Vorschau\n\n${process.env.PREVIEW_URL}\n\nDieser Preview-Worker wird beim Schliessen oder Mergen des PRs entfernt.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    name: Remove closed PR preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - name: Delete preview Worker if it exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=Preview cleanup configuration::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          worker_name="fang-x-pr-${PR_NUMBER}"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker_name}")
          if [[ "$status" == "200" ]]; then
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker_name}")
            if [[ "$status" != "200" ]]; then
              echo "::error title=Preview cleanup failed::Cloudflare returned HTTP $status while deleting $worker_name."
              exit 1
            fi
            echo "Deleted preview Worker $worker_name."
          elif [[ "$status" == "404" ]]; then
            echo "Preview Worker $worker_name was already absent."
          else
            echo "::error title=Preview cleanup failed::Cloudflare returned HTTP $status while checking $worker_name."
            exit 1
          fi

      - name: Mark preview link as removed
        uses: actions/github-script@v9
        with:
          script: |
            const marker = "<!-- fang-x-pr-preview -->";
            const body = `${marker}\n### Fang X Vorschau\n\nVorschau entfernt, da dieser PR geschlossen oder gemergt wurde.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            }
